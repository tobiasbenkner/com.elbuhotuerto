# Eigenständiges Repo EINER Kundenseite. Die Workspace-Wurzel IST die
# Astro-Seite selbst; darunter liegen die Pakete, die früher im Monorepo
# pulpo.cloud.websites von allen Seiten geteilt wurden (@pulpo/cms, @pulpo/i18n).
# Dadurch bleiben die `workspace:*`-Abhängigkeiten in der package.json gültig
# und es musste keine einzige Import-Zeile angefasst werden.
packages:
  - "packages/*"

name: Build and Deploy

# Drei Auslöser:
#   push               — Code-Änderung an dieser Seite
#   repository_dispatch — INHALTS-Änderung in Paula (Webhook, event_type "rebuild");
#                         siehe README → „Automatischer Rebuild"
#   workflow_dispatch  — manueller Anstoß über die GitHub-Oberfläche
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [rebuild]
  workflow_dispatch:

# `pages: write` und `id-token: write` braucht actions/deploy-pages, um das
# Build-Ergebnis als Pages-Deployment zu veröffentlichen.
permissions:
  contents: read
  pages: write
  id-token: write

# Ein Lauf zur Zeit. Ohne das könnten zwei Läufe (z. B. eine Preisänderung
# während eines Code-Pushes) gleichzeitig deployen — welcher Inhalt am Ende
# ausgeliefert wird, wäre dann Zufall. Ältere Läufe werden abgebrochen: sie
# würden ohnehin nur einen veralteten Stand veröffentlichen.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Auslöser protokollieren
        run: echo "Ausgelöst durch '${{ github.event_name }}'"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4

      # Gecacht wird ausschließlich der pnpm-Store (heruntergeladene Pakete),
      # niemals das Build-Ergebnis. Wichtig, weil die Seite ihre Inhalte
      # WÄHREND des Builds aus Paula holt: ein reiner Inhalts-Rebuild läuft
      # beim selben Commit erneut durch `pnpm build` und holt frische Daten.
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Bauen
        run: pnpm build

      - name: Build-Ergebnis für Pages bereitstellen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
